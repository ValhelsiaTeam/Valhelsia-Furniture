plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

version = mod_version

Project common = project(":common")
evaluationDependsOn(common.path)

repositories {
    maven {
        url = "https://www.cursemaven.com"
    }
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
}

base {
    archivesName = mod_id + '-fabric'
}

sourceSets {
    main {
        java {
            srcDir common.sourceSets.main.java.srcDirs
        }
        resources {
            srcDir common.sourceSets.main.resources.srcDirs
        }
    }
}

loom {
    mixin {
        add sourceSets.main, "${mod_id}.refmap.json"
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly(common)

    modImplementation "net.valhelsia:valhelsia_core-fabric-${minecraft_version}:${valhelsia_core_version}"

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    mappings loom.officialMojangMappings()
    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

compileJava {
    source project(':common').sourceSets.main.allSource
}

processResources {
    var replaceProperties = [version : mod_version]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
