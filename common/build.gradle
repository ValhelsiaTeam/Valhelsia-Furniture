plugins {
    id("net.neoforged.moddev")
}

neoForge {
    neoFormVersion = neo_form_version

    accessTransformers {
        publish(file("src/main/resources/META-INF/accesstransformer.cfg"))
    }
}

dependencies {
    if (valhelsia_core_version?.trim()) {
        implementation "net.valhelsia:valhelsia_core-common:${valhelsia_core_version}"
        accessTransformers "net.valhelsia:valhelsia_core-common:${valhelsia_core_version}"
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    sourceSets.main.resources.sourceDirectories.each { dir ->
        commonResources dir
    }
}

tasks.named("processResources", ProcessResources).configure {
    exclude(".cache/**")
}

tasks.named("sourcesJar", Jar).configure {
    exclude(".cache/**")
}
