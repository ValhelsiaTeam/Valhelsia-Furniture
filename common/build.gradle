plugins {
    id("net.neoforged.moddev")
}

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    if (project.hasProperty("valhelsia_core_version") && findProperty("valhelsia_core_version")?.trim()) {
        implementation "net.valhelsia:valhelsia_core-common:${valhelsia_core_version}"
        accessTransformers "net.valhelsia:valhelsia_core-common:${valhelsia_core_version}"
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
